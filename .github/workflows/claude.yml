name: Claude Code

# Thin caller: delegates to the central reusable workflow in
# khadidjabensallah/.github so the logic lives in one place.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    uses: khadidjabensallah/.github/.github/workflows/claude-reusable.yml@main
    secrets: inherit
